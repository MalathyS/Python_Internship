
name: Employee Management CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  # ---------------------------
  # CI: Run Python Tests
  # ---------------------------
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    env:
      JWT_SECRET_KEY: test-secret-key-for-ci-only
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: test_db

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: python -m pytest -v

  # ---------------------------
  # CD: Deploy to Google Cloud
  # ---------------------------
  deploy:
    name: Deploy to GCP Cloud Run
    runs-on: ubuntu-latest

    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Authenticate GitHub Actions with GCP using WIF
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      # Install Google Cloud SDK
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # Configure Docker to push images to Artifact Registry
      - name: Configure Docker
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # Build Docker image
      - name: Build Docker Image
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/employee-api/employee-management-python-api:${GITHUB_SHA}"
          docker build -t "$IMAGE_URI" .
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      # Push image
      - name: Push Docker Image
        run: |
          docker push "$IMAGE_URI"

      # Update existing migration job with the new image
      - name: Update Database Migration Job
        run: |
          gcloud run jobs update employee-db-migration \
            --image="$IMAGE_URI" \
            --region="$REGION" \
            --project="$PROJECT_ID"

      # Execute database migrations before API deployment
      - name: Run Database Migrations
        run: |
          gcloud run jobs execute employee-db-migration \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --wait

      # Deploy API only after successful migration
      - name: Deploy FastAPI to Cloud Run
        run: |
          gcloud run deploy employee-api \
            --image="$IMAGE_URI" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --service-account="employee-api-runtime@project-8e9f0da6-5a28-4ab2-9c3.iam.gserviceaccount.com" \
            --add-cloudsql-instances="project-8e9f0da6-5a28-4ab2-9c3:asia-south1:employee-python-project" \
            --quiet
